<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="华中科技大学生物科学（中外合作办学）2024级四个班的周课表。切换班级，左右滑动查看每周课程。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>生科课表 · 2024级</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=4">
  <script type="module" src="./app.mjs?v=4"></script>
</head>
<body>
<main id="home" class="home" aria-labelledby="home-title">
  <div class="home-brand"><img src="./icon.svg" alt="" width="38" height="38"><span>生科课表<small>2024 级 · 四班共享</small></span></div>
  <section class="home-content">
    <p class="home-eyebrow">2026—2027 学年 · 第一学期</p>
    <h1 id="home-title" tabindex="-1">想看哪个班的课表？</h1>
    <p class="home-intro">选择一个班级，查看每周课程安排。</p>
    <div class="home-classes" aria-label="选择要查看的班级">
      <button class="home-class" data-class="1" aria-label="查看1班课表" disabled><span class="home-class-number">1<span>班</span></span><small>202401</small><span class="home-class-link">查看课表 <span aria-hidden="true">↗</span></span></button>
      <button class="home-class" data-class="2" aria-label="查看2班课表" disabled><span class="home-class-number">2<span>班</span></span><small>202402</small><span class="home-class-link">查看课表 <span aria-hidden="true">↗</span></span></button>
      <button class="home-class" data-class="3" aria-label="查看3班课表" disabled><span class="home-class-number">3<span>班</span></span><small>202403</small><span class="home-class-link">查看课表 <span aria-hidden="true">↗</span></span></button>
      <button class="home-class" data-class="4" aria-label="查看4班课表" disabled><span class="home-class-number">4<span>班</span></span><small>202404</small><span class="home-class-link">查看课表 <span aria-hidden="true">↗</span></span></button>
    </div>
    <p id="home-status" class="home-hint" role="status">正在读取课表…</p>
  </section>
  <footer class="home-footer">华中科技大学<br><span>生物科学（中外合作办学）</span></footer>
</main>
<div class="app" id="timetable" hidden>
  <header class="header">
    <div class="toolbar">
      <div class="date-week"><div id="today"></div><div class="week-line"><button id="week-button" aria-label="选择周次">第 9 周 <span class="tiny-chevron">⌄</span></button><button id="back-current" hidden>回到本周</button></div></div>
      <div class="toolbar-actions">
        <button id="previous" class="icon-button" aria-label="上一周"><svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg></button>
        <button id="next" class="icon-button" aria-label="下一周"><svg viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></svg></button>
        <button id="class-button" class="class-button" aria-label="切换班级">1 班 <span>⌄</span></button>
        <button id="agenda-button" class="agenda-button">日程</button>
      </div>
    </div>
    <div class="elective-toolbar"><button id="elective-button" aria-label="选择专业选修课"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M5 10h10M8 15h4"/></svg><span id="elective-summary">选修课 3/3</span><span aria-hidden="true">⌄</span></button></div>
    <div id="day-header" class="day-header"></div>
  </header>
  <main id="main" tabindex="-1">
    <section id="schedule-view" aria-label="每周课程表">
      <div id="grid" class="grid"><div class="loading">正在读取课表…</div></div>
    </section>
    <section id="agenda-view" class="agenda-view" hidden aria-label="本周日程"></section>
  </main>
  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-item active" id="nav-schedule"><svg viewBox="0 0 28 28"><rect x="5" y="6" width="18" height="18" rx="5"/><path d="M10 4v5m8-5v5M9 13h10M9 17h6"/></svg><span>课表</span></button>
    <button class="nav-item" id="nav-class" aria-label="返回首页选择班级"><svg viewBox="0 0 28 28"><rect x="4" y="9" width="16" height="14" rx="5"/><path d="M9 5h10a5 5 0 0 1 5 5v8M8 15h1m3 0h1m3 0h1"/></svg><span>班级</span></button>
    <button class="nav-item" id="nav-tools"><svg viewBox="0 0 28 28"><rect x="4" y="9" width="20" height="14" rx="4"/><path d="M10 9V6h8v3M4 15h20m-12-2h4v5h-4z"/></svg><span>工具箱</span></button>
    <button class="nav-item" id="nav-mine"><svg viewBox="0 0 28 28"><circle cx="14" cy="9" r="5"/><path d="M5 24v-3a9 9 0 0 1 18 0v3z"/></svg><span>我的</span></button>
  </nav>
</div>
<section id="lesson-page" class="lesson-page" aria-labelledby="lesson-title" hidden>
  <header class="lesson-header"><button id="lesson-back" aria-label="返回课表">‹ 返回课表</button><span>共享课堂记录</span></header>
  <main class="lesson-main">
    <span id="lesson-group" class="detail-chip"></span><h1 id="lesson-title" tabindex="-1"></h1>
    <p id="lesson-meta" class="lesson-meta"></p>
    <details class="lesson-details"><summary>教师与上课地点</summary><div id="lesson-details-body"></div></details>
    <div id="other-classes" class="other-classes"></div>
    <p class="notes-intro">大家一起补充，其他班也能查看，为下一次课堂做准备。</p>
    <label class="note-box"><span>上课内容</span><small>知识点、课堂进度、实验步骤…</small><textarea id="note-content" rows="7" maxlength="8000" placeholder="这节课讲了什么？一起记下来。" disabled></textarea></label>
    <label class="note-box important-box"><span>重要信息</span><small>作业、截止时间、考试提醒、注意事项…</small><textarea id="note-important" rows="6" maxlength="8000" placeholder="有哪些需要同学提前知道的信息？" disabled></textarea></label>
    <div id="note-conflict" class="note-conflict" hidden></div>
    <p id="note-status" class="note-status" role="status"></p>
    <div class="note-utilities"><button id="note-reload">重新读取</button><button id="note-history">历史版本</button></div>
  </main>
  <footer class="lesson-footer"><span>记录将公开给所有同学</span><button id="note-save" class="primary" disabled>保存记录</button></footer>
</section>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" class="close-button" aria-label="关闭">×</button></div><div id="sheet-body"></div></dialog>
<div id="toast" role="status" class="toast" hidden></div>
<div id="announcement" class="sr-only" aria-live="polite"></div>
</body>
</html>
